name: Staging

# Fires on every push to dev — which, because dev is PR-only, is always a
# squash-merged PR landing. Re-runs the CI stages on the integrated branch and
# packages a release-candidate bundle that a staging deployer pulls by hand.
# No SSH, no cloud, no deployment: this workflow only uploads an artifact.
#
# ci.yml also runs on this push (its push trigger is unfiltered). That
# duplication is accepted: ci.yml answers "is the branch green", this answers
# "here is what staging should run".
#
# staging.yml owns the dev release candidate; ci.yml owns branches;
# production.yml owns tags.

on:
  push:
    branches: [dev]

concurrency:
  group: staging-dev
  cancel-in-progress: true

jobs:
  # Database-less gates on the integrated dev branch (mirrors production.yml
  # `verify`, minus the tag-only checks).
  verify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-dummy-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Lint
        run: bash scripts/ci.sh lint
      - name: Check every model change has a migration
        run: bash scripts/ci.sh migrations
      - name: Check generated policy artifacts are fresh
        run: bash scripts/ci.sh export
      - name: Check consumer INTEGRATION.md contracts match the registry
        run: bash scripts/ci.sh docs
      - name: Test
        run: bash scripts/ci.sh test

  # The registry gate against a real PostgreSQL, as in ci.yml.
  verify-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      ENVIRONMENT: development
      DB_NAME: ci_db
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt
      - name: Validate policy engine
        run: bash scripts/ci.sh policy

  # Package the release candidate a staging deployer pulls by hand. Runs only
  # after both verification jobs pass.
  release-candidate:
    needs: [verify, verify-policy]
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-dummy-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Regenerate registry artifacts from the integrated commit
        run: |
          python backend/manage.py export_policy_registry --format registry \
            --output backend/core/policy_engine/docs/registry_export.json --settings=core.settings.testing
          python backend/manage.py export_policy_registry --format openapi \
            --output backend/core/policy_engine/docs/openapi.json --settings=core.settings.testing

      - name: Committed artifacts match the regenerated ones
        run: |
          if ! git diff --quiet -- backend/core/policy_engine/docs/; then
            echo "::error::Committed policy artifacts differ from those regenerated on dev."
            git diff --stat -- backend/core/policy_engine/docs/
            exit 1
          fi

      - name: Write the release-candidate manifest
        run: |
          printf 'version=%s\ncommit=%s\nbranch=dev\nbuilt_utc=%s\n' \
            "$(cat VERSION)" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > rc_manifest.txt
          cat rc_manifest.txt

      - name: Upload the release-candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          retention-days: 14
          path: |
            deploy.md
            deploy/env.production.example
            backend/core/policy_engine/docs/registry_export.json
            backend/core/policy_engine/docs/openapi.json
            backend/core/policy_engine/docs/registry_schema.json
            VERSION
            CHANGELOG.md
            rc_manifest.txt
